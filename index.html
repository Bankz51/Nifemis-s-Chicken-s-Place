 
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Nifemi's Chicken Place - Premium Frozen Foods</title>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
    <style>  
        :root {  
            --primary: #d90429;  
            --primary-hover: #ef233c;  
            --accent: #ffb703;  
            --dark: #111111;  
            --card-bg: #1e1e1e;  
            --text-light: #f8f9fa;  
            --text-muted: #adb5bd;  
            --border: #333333;  
            --radius: 12px;  
            --transition: all 0.3s ease;  
        }  
  
        * {  
            box-sizing: border-box;  
            margin: 0;  
            padding: 0;  
        }  
  
        body {  
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;  
            background-color: var(--dark);  
            color: var(--text-light);  
            line-height: 1.6;  
            overflow-x: hidden;  
        }  
  
        a {  
            color: inherit;  
            text-decoration: none;  
        }  
  
        /* Responsive Layout Container */  
        .container {  
            width: 90%;  
            max-width: 1200px;  
            margin: 0 auto;  
            padding: 0 15px;  
        }  
  
        /* Header & Navigation */  
        header {  
            background-color: rgba(17, 17, 17, 0.95);  
            position: sticky;  
            top: 0;  
            z-index: 1000;  
            border-bottom: 1px solid var(--border);  
            backdrop-filter: blur(10px);  
        }  
  
        .nav-wrapper {  
            display: flex;  
            justify-content: space-between;  
            align-items: center;  
            height: 70px;  
        }  
  
        .logo {  
            font-size: 1.5rem;  
            font-weight: 700;  
            color: var(--accent);  
            display: flex;  
            align-items: center;  
            gap: 10px;  
        }  
  
        .nav-links {  
            display: flex;  
            gap: 20px;  
            list-style: none;  
        }  
  
        .nav-links a:hover {  
            color: var(--accent);  
            transition: var(--transition);  
        }  
  
        .cart-icon-btn {  
            background: transparent;  
            border: none;  
            color: var(--text-light);  
            font-size: 1.3rem;  
            cursor: pointer;  
            position: relative;  
        }  
  
        .cart-badge {  
            position: absolute;  
            top: -8px;  
            right: -8px;  
            background: var(--primary);  
            color: #fff;  
            border-radius: 50%;  
            width: 18px;  
            height: 18px;  
            font-size: 0.75rem;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
        }  
  
        /* Hero Section */  
        .hero {  
            padding: 80px 0 60px;  
            text-align: center;  
            background: linear-gradient(180deg, rgba(217,4,41,0.1) 0%, rgba(17,17,17,1) 100%);  
        }  
  
        .hero h1 {  
            font-size: 2.5rem;  
            margin-bottom: 15px;  
            color: var(--text-light);  
        }  
  
        .hero p {  
            color: var(--text-muted);  
            max-width: 600px;  
            margin: 0 auto 30px;  
            font-size: 1.1rem;  
        }  
  
        /* Filter Tabs */  
        .filter-container {  
            display: flex;  
            justify-content: center;  
            gap: 10px;  
            flex-wrap: wrap;  
            margin-bottom: 40px;  
        }  
  
        .filter-btn {  
            background-color: var(--card-bg);  
            color: var(--text-light);  
            border: 1px solid var(--border);  
            padding: 8px 18px;  
            border-radius: 20px;  
            cursor: pointer;  
            transition: var(--transition);  
        }  
  
        .filter-btn.active, .filter-btn:hover {  
            background-color: var(--primary);  
            border-color: var(--primary);  
        }  
  
        /* Products Grid (Mobile Responsive) */  
        .products-grid {  
            display: grid;  
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));  
            gap: 25px;  
            margin-bottom: 60px;  
        }  
  
        .product-card {  
            background: var(--card-bg);  
            border-radius: var(--radius);  
            border: 1px solid var(--border);  
            overflow: hidden;  
            display: flex;  
            flex-direction: column;  
            transition: var(--transition);  
        }  
  
        .product-card:hover {  
            transform: translateY(-5px);  
            border-color: var(--accent);  
        }  
  
        .product-img {  
            width: 100%;  
            height: 200px;  
            object-fit: cover;  
            background-color: #2a2a2a;  
        }  
  
        .product-info {  
            padding: 20px;  
            display: flex;  
            flex-direction: column;  
            flex-grow: 1;  
        }  
  
        .product-title {  
            font-size: 1.2rem;  
            margin-bottom: 8px;  
        }  
  
        .product-price {  
            font-size: 1.1rem;  
            color: var(--accent);  
            font-weight: bold;  
            margin-bottom: 15px;  
        }  
  
        .add-cart-btn {  
            margin-top: auto;  
            background: var(--primary);  
            color: #fff;  
            border: none;  
            padding: 10px;  
            border-radius: 6px;  
            cursor: pointer;  
            font-weight: 600;  
            transition: var(--transition);  
        }  
  
        .add-cart-btn:hover {  
            background: var(--primary-hover);  
        }  
  
        /* Corrected Reviews Carousel Section */  
        .reviews-section {  
            padding: 60px 0;  
            background-color: #161616;  
            border-top: 1px solid var(--border);  
            border-bottom: 1px solid var(--border);  
        }  
  
        .section-header {  
            text-align: center;  
            margin-bottom: 40px;  
        }  
  
        .carousel-wrapper {  
            position: relative;  
            max-width: 800px;  
            margin: 0 auto;  
            overflow: hidden;  
            padding: 0 40px;  
        }  
  
        .carousel-track {  
            display: flex;  
            transition: transform 0.4s ease-in-out;  
            width: 100%;  
        }  
  
        .review-card {  
            min-width: 100%;  
            box-sizing: border-box;  
            background: var(--card-bg);  
            border: 1px solid var(--border);  
            border-radius: var(--radius);  
            padding: 30px;  
            text-align: center;  
        }  
  
        .review-stars {  
            color: var(--accent);  
            margin-bottom: 15px;  
        }  
  
        .review-text {  
            font-style: italic;  
            color: var(--text-light);  
            margin-bottom: 15px;  
        }  
  
        .review-author {  
            font-weight: bold;  
            color: var(--text-muted);  
        }  
  
        .carousel-btn {  
            position: absolute;  
            top: 50%;  
            transform: translateY(-50%);  
            background: var(--card-bg);  
            border: 1px solid var(--border);  
            color: var(--text-light);  
            width: 40px;  
            height: 40px;  
            border-radius: 50%;  
            cursor: pointer;  
            z-index: 10;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            transition: var(--transition);  
        }  
  
        .carousel-btn:hover {  
            background: var(--primary);  
        }  
  
        .carousel-btn.prev { left: 0; }  
        .carousel-btn.next { right: 0; }  
  
        /* Review Submission Form */  
        .review-form-container {  
            max-width: 600px;  
            margin: 40px auto 0;  
            background: var(--card-bg);  
            padding: 25px;  
            border-radius: var(--radius);  
            border: 1px solid var(--border);  
        }  
  
        .form-group {  
            margin-bottom: 15px;  
        }  
  
        .form-group label {  
            display: block;  
            margin-bottom: 5px;  
            color: var(--text-muted);  
        }  
  
        .form-group input, .form-group textarea, .form-group select {  
            width: 100%;  
            padding: 10px;  
            background: #2b2b2b;  
            border: 1px solid var(--border);  
            border-radius: 6px;  
            color: #fff;  
        }  
  
        .submit-btn {  
            background: var(--primary);  
            color: #fff;  
            border: none;  
            padding: 10px 20px;  
            border-radius: 6px;  
            cursor: pointer;  
            width: 100%;  
            font-weight: bold;  
        }  
  
        /* Slide-out Cart */  
        .cart-drawer {  
            position: fixed;  
            top: 0;  
            right: -400px;  
            width: 100%;  
            max-width: 380px;  
            height: 100%;  
            background: var(--card-bg);  
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);  
            z-index: 2000;  
            transition: right 0.3s ease;  
            padding: 20px;  
            display: flex;  
            flex-direction: column;  
        }  
  
        .cart-drawer.open {  
            right: 0;  
        }  
  
        .cart-header {  
            display: flex;  
            justify-content: space-between;  
            align-items: center;  
            border-bottom: 1px solid var(--border);  
            padding-bottom: 15px;  
            margin-bottom: 20px;  
        }  
  
        .close-cart {  
            background: none;  
            border: none;  
            color: #fff;  
            font-size: 1.5rem;  
            cursor: pointer;  
        }  
  
        .cart-items {  
            flex-grow: 1;  
            overflow-y: auto;  
        }  
  
        .cart-item {  
            display: flex;  
            justify-content: space-between;  
            align-items: center;  
            margin-bottom: 15px;  
            padding-bottom: 10px;  
            border-bottom: 1px solid var(--border);  
        }  
  
        .whatsapp-checkout-btn {  
            background: #25D366;  
            color: #fff;  
            border: none;  
            padding: 12px;  
            border-radius: 6px;  
            font-weight: bold;  
            cursor: pointer;  
            width: 100%;  
            margin-top: 15px;  
        }  
  
        /* Footer */  
        footer {  
            padding: 40px 0;  
            text-align: center;  
            border-top: 1px solid var(--border);  
            color: var(--text-muted);  
        }  
  
        /* Responsive Breakpoints */  
        @media (max-width: 768px) {  
            .hero h1 { font-size: 1.8rem; }  
            .carousel-wrapper { padding: 0 20px; }  
            .carousel-btn { width: 32px; height: 32px; }  
            .nav-links { display: none; } /* Simplified mobile header */  
        }  
    </style>  
</head>  
<body>  
  
    <!-- Header Navigation -->  
    <header>  
        <div class="container nav-wrapper">  
            <a href="#" class="logo">  
                <i class="fa-solid fa-drumstick-bite"></i> Nifemi's Chicken Place  
            </a>  
            <ul class="nav-links">  
                <li><a href="#products">Products</a></li>  
                <li><a href="#reviews">Reviews</a></li>  
            </ul>  
            <button class="cart-icon-btn" id="openCartBtn">  
                <i class="fa-solid fa-shopping-cart"></i>  
                <span class="cart-badge" id="cartBadge">0</span>  
            </button>  
        </div>  
    </header>  
  
    <!-- Main Hero Section -->  
    <section class="hero">  
        <div class="container">  
            <h1>Fresh & Frozen Poultry Delivered</h1>  
            <p>High quality frozen chicken, turkey, seafood, and egg supplies at competitive prices.</p>  
        </div>  
    </section>  
  
    <!-- Catalog Section -->  
    <section class="container" id="products">  
        <div class="filter-container">  
            <button class="filter-btn active" data-filter="all">All</button>  
            <button class="filter-btn" data-filter="poultry">Poultry</button>  
            <button class="filter-btn" data-filter="seafood">Seafood</button>  
            <button class="filter-btn" data-filter="other">Other</button>  
        </div>  
  
        <div class="products-grid" id="productsGrid">  
            <!-- Product Cards rendered via JS -->  
        </div>  
    </section>  
  
    <!-- Corrected Reviews Carousel Section -->  
    <section class="reviews-section" id="reviews">  
        <div class="container">  
            <div class="section-header">  
                <h2>Customer Reviews</h2>  
            </div>  
              
            <div class="carousel-wrapper">  
                <button class="carousel-btn prev" id="prevReview"><i class="fa-solid fa-chevron-left"></i></button>  
                <div class="carousel-track" id="carouselTrack">  
                    <!-- Dynamic review slides insertion -->  
                </div>  
                <button class="carousel-btn next" id="nextReview"><i class="fa-solid fa-chevron-right"></i></button>  
            </div>  
  
            <!-- Review Submission Form -->  
            <div class="review-form-container">  
                <h3 style="margin-bottom: 15px; text-align: center;">Leave a Review</h3>  
                <form id="reviewForm">  
                    <div class="form-group">  
                        <label>Your Name</label>  
                        <input type="text" id="reviewAuthor" required>  
                    </div>  
                    <div class="form-group">  
                        <label>Rating</label>  
                        <select id="reviewRating">  
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>  
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>  
                            <option value="3">⭐⭐⭐ (3/5)</option>  
                            <option value="2">⭐⭐ (2/5)</option>  
                            <option value="1">⭐ (1/5)</option>  
                        </select>  
                    </div>  
                    <div class="form-group">  
                        <label>Review</label>  
                        <textarea id="reviewText" rows="3" required></textarea>  
                    </div>  
                    <button type="submit" class="submit-btn">Submit Review</button>  
                </form>  
            </div>  
        </div>  
    </section>  
  
    <!-- Slide-out Shopping Cart Drawer -->  
    <div class="cart-drawer" id="cartDrawer">  
        <div class="cart-header">  
            <h3>Your Order</h3>  
            <button class="close-cart" id="closeCartBtn">&times;</button>  
        </div>  
        <div class="cart-items" id="cartItems">  
            <!-- Items inserted dynamic -->  
        </div>  
        <div>  
            <p style="margin-bottom: 10px; font-weight: bold;">Total: ₦<span id="cartTotal">0</span></p>  
            <button class="whatsapp-checkout-btn" id="whatsappBtn">  
                <i class="fa-brands fa-whatsapp"></i> Order via WhatsApp  
            </button>  
        </div>  
    </div>  
  
    <footer>  
        <div class="container">  
            <p>&copy; 2026 Nifemi's Chicken Place. All rights reserved.</p>  
        </div>  
    </footer>  
  
    <!-- Consolidated Application Logic Script -->  
    <script>  
        // Catalog items source data  
        const productsData = [  
            { id: 1, name: "Fresh Chicken", category: "poultry", price: 6000, unit: "kg", img: "https://via.placeholder.com/300x200?text=Fresh+Chicken" },  
            { id: 2, name: "Chicken Orobo", category: "poultry", price: 6500, unit: "kg", img: "https://via.placeholder.com/300x200?text=Chicken+Orobo" },  
            { id: 3, name: "Turkey Laps", category: "poultry", price: 7000, unit: "kg", img: "https://via.placeholder.com/300x200?text=Turkey+Laps" },  
            { id: 4, name: "Gizzard", category: "poultry", price: 5500, unit: "kg", img: "https://via.placeholder.com/300x200?text=Gizzard" },  
            { id: 5, name: "Shrimps", category: "seafood", price: 4800, unit: "250g", img: "https://via.placeholder.com/300x200?text=Shrimps" },  
            { id: 6, name: "Eggs", category: "other", price: 5500, unit: "crate", img: "https://via.placeholder.com/300x200?text=Eggs" }  
        ];  
  
        // Sample initial data for reviews carousel  
        let reviewsData = [  
            { name: "Blessing A.", rating: 5, comment: "Very fresh chicken products and prompt delivery service to my doorstep." },  
            { name: "Tunde O.", rating: 5, comment: "Best frozen food center around Asero Estate. Reliable quality always." },  
            { name: "Mrs. Kemi", rating: 4, comment: "Affordable items and cleanly packaged turkey laps." }  
        ];  
  
        let cart = [];  
        let currentSlideIndex = 0;  
  
        // Render Product Cards  
        function renderProducts(filter = 'all') {  
            const grid = document.getElementById('productsGrid');  
            grid.innerHTML = '';  
              
            const filteredItems = filter === 'all'   
                ? productsData   
                : productsData.filter(item => item.category === filter);  
  
            filteredItems.forEach(product => {  
                const card = document.createElement('div');  
                card.className = 'product-card';  
                card.innerHTML = `  
                    <img src="${product.img}" alt="${product.name}" class="product-img">  
                    <div class="product-info">  
                        <div class="product-title">${product.name}</div>  
                        <div class="product-price">₦${product.price.toLocaleString()} / ${product.unit}</div>  
                        <button class="add-cart-btn" onclick="addToCart(${product.id})">Add to Order</button>  
                    </div>  
                `;  
                grid.appendChild(card);  
            });  
        }  
  
        // Filter Event Listeners  
        document.querySelectorAll('.filter-btn').forEach(btn => {  
            btn.addEventListener('click', (e) => {  
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));  
                e.target.classList.add('active');  
                renderProducts(e.target.dataset.filter);  
            });  
        });  
  
        // Cart State & Functionality  
        function addToCart(productId) {  
            const product = productsData.find(p => p.id === productId);  
            const existingItem = cart.find(item => item.id === productId);  
  
            if (existingItem) {  
                existingItem.qty += 1;  
            } else {  
                cart.push({ ...product, qty: 1 });  
            }  
            updateCartUI();  
        }  
  
        function updateCartUI() {  
            const cartItemsContainer = document.getElementById('cartItems');  
            const cartTotal = document.getElementById('cartTotal');  
            const cartBadge = document.getElementById('cartBadge');  
  
            cartItemsContainer.innerHTML = '';  
            let total = 0;  
            let count = 0;  
  
            cart.forEach(item => {  
                total += item.price * item.qty;  
                count += item.qty;  
                const div = document.createElement('div');  
                div.className = 'cart-item';  
                div.innerHTML = `  
                    <div>  
                        <h4>${item.name}</h4>  
                        <small>₦${item.price} x ${item.qty}</small>  
                    </div>  
                    <div>  
                        <strong>₦${item.price * item.qty}</strong>  
                    </div>  
                `;  
                cartItemsContainer.appendChild(div);  
            });  
  
            cartTotal.innerText = total.toLocaleString();  
            cartBadge.innerText = count;  
        }  
  
        // WhatsApp Checkout Integration  
        document.getElementById('whatsappBtn').addEventListener('click', () => {  
            if (cart.length === 0) {  
                alert("Your shopping cart is currently empty.");  
                return;  
            }  
  
            let text = "Hello Nifemi's Chicken Place, I want to order:\n\n";  
            let grandTotal = 0;  
            cart.forEach(item => {  
                const subtotal = item.price * item.qty;  
                grandTotal += subtotal;  
                text += `- ${item.name} (${item.qty} ${item.unit}): ₦${subtotal.toLocaleString()}\n`;  
            });  
            text += `\nTotal: ₦${grandTotal.toLocaleString()}`;  
  
            const phone = "2347073527944";  
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');  
        });  
  
        // Drawer Controls  
        const drawer = document.getElementById('cartDrawer');  
        document.getElementById('openCartBtn').onclick = () => drawer.classList.add('open');  
        document.getElementById('closeCartBtn').onclick = () => drawer.classList.remove('open');  
  
        // Review Carousel System Controls  
        function renderCarousel() {  
            const track = document.getElementById('carouselTrack');  
            track.innerHTML = '';  
              
            reviewsData.forEach(rev => {  
                const slide = document.createElement('div');  
                slide.className = 'review-card';  
                slide.innerHTML = `  
                    <div class="review-stars">${'⭐'.repeat(rev.rating)}</div>  
                    <p class="review-text">"${rev.comment}"</p>  
                    <div class="review-author">- ${rev.name}</div>  
                `;  
                track.appendChild(slide);  
            });  
            updateCarouselPosition();  
        }  
  
        function updateCarouselPosition() {  
            const track = document.getElementById('carouselTrack');  
            track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;  
        }  
  
        document.getElementById('nextReview').addEventListener('click', () => {  
            currentSlideIndex = (currentSlideIndex + 1) % reviewsData.length;  
            updateCarouselPosition();  
        });  
  
        document.getElementById('prevReview').addEventListener('click', () => {  
            currentSlideIndex = (currentSlideIndex - 1 + reviewsData.length) % reviewsData.length;  
            updateCarouselPosition();  
        });  
  
        // Review Submission Form  
        document.getElementById('reviewForm').addEventListener('submit', (e) => {  
            e.preventDefault();  
            const name = document.getElementById('reviewAuthor').value;  
            const rating = parseInt(document.getElementById('reviewRating').value);  
            const comment = document.getElementById('reviewText').value;  
  
            reviewsData.push({ name, rating, comment });  
            renderCarousel();  
  
            // Set carousel position to newly added review  
            currentSlideIndex = reviewsData.length - 1;  
            updateCarouselPosition();  
  
            // Clear inputs  
            document.getElementById('reviewForm').reset();  
        });  
  
        // Initial setup execution  
        renderProducts();  
        renderCarousel();  
    </script>  
</body>  
</html>
