<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nifemi's Chicken's Place — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f7f3e8;
    padding: 25px;
}

.login-box,
.admin-box {
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h1,
h2 {
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
}

button {
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.login-btn {
    width: 100%;
    background: #d6a62a;
    color: white;
}

.logout {
    background: #333;
    color: white;
    float: right;
}

.review {
    background: #fff;
    border: 1px solid #eee;
    padding: 20px;
    margin-top: 20px;
    border-radius: 15px;
}

.stars {
    color: #d6a62a;
    font-size: 20px;
}

.name {
    font-weight: bold;
    margin-top: 10px;
}

.buttons {
    margin-top: 15px;
    display: flex;
    gap: 10px;
}

.approve {
    background: #198754;
    color: white;
}

.delete {
    background: #dc3545;
    color: white;
}

#adminPanel {
    display: none;
}

#error {
    color: #dc3545;
    text-align: center;
}

</style>

</head>

<body>


<!-- LOGIN -->

<div class="login-box" id="loginBox">

    <h1>Admin Login</h1>

    <input
        type="email"
        id="email"
        placeholder="Admin email">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button
        class="login-btn"
        onclick="login()">

        Login

    </button>

    <p id="error"></p>

</div>


<!-- ADMIN -->

<div class="admin-box" id="adminPanel">

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

    <h1>Review Management</h1>

    <div id="reviews">
        Loading reviews...
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ovefnpllavbyjmfckxhw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_XoYquWqdNy9vzH2LhqAmSg_dTfsBR4l";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   LOGIN
========================== */

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        document.getElementById("error")
            .textContent =
            "Invalid email or password.";

        return;
    }


    showAdmin();

}


/* =========================
   LOGOUT
========================== */

async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel")
        .style.display = "none";

    document.getElementById("loginBox")
        .style.display = "block";

}


/* =========================
   CHECK LOGIN
========================== */

async function checkLogin() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (session) {

        showAdmin();

    }

}


/* =========================
   SHOW ADMIN
========================== */

function showAdmin() {

    document.getElementById("loginBox")
        .style.display = "none";

    document.getElementById("adminPanel")
        .style.display = "block";

    loadReviews();

}


/* =========================
   LOAD REVIEWS
========================== */

async function loadReviews() {

    const container =
        document.getElementById("reviews");


    const { data, error } =
        await supabaseClient
            .from("reviews NCP")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        container.innerHTML =
            "<p>Unable to load reviews.</p>";

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No reviews found.</p>";

        return;
    }


    container.innerHTML =
        data.map(review => {

            const rating =
                Number(review.rating) || 0;


            return `

                <div class="review">

                    <div class="stars">
                        ${"★".repeat(rating)}
                        ${"☆".repeat(5 - rating)}
                    </div>

                    <div class="name">
                        ${review.name}
                    </div>

                    <p>
                        ${review.review}
                    </p>

                    <strong>
                        Status:
                        ${
                            review.approved
                            ? "Approved"
                            : "Pending"
                        }
                    </strong>

                    <div class="buttons">

                        ${
                            !review.approved
                            ? `
                                <button
                                    class="approve"
                                    onclick="approveReview('${review.id}')">

                                    Approve

                                </button>
                            `
                            : ""
                        }

                        <button
                            class="delete"
                            onclick="deleteReview('${review.id}')">

                            Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   APPROVE
========================== */

async function approveReview(id) {

    const { error } =
        await supabaseClient
            .from("reviews NCP")
            .update({
                approved: true
            })
            .eq("id", id);


    if (error) {

        alert(
            "Unable to approve review."
        );

        console.error(error);

        return;
    }


    loadReviews();

}


/* =========================
   DELETE
========================== */

async function deleteReview(id) {

    if (
        !confirm(
            "Delete this review?"
        )
    ) return;


    const { error } =
        await supabaseClient
            .from("reviews NCP")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Unable to delete review."
        );

        console.error(error);

        return;
    }


    loadReviews();

}


checkLogin();

</script>

</body>
</html>
