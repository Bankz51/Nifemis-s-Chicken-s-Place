<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f3e8;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .review {
            background: white;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .stars {
            color: #d6a62a;
            font-size: 20px;
        }

        .name {
            font-weight: bold;
            margin-top: 10px;
        }

        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve {
            background: #198754;
            color: white;
        }

        .delete {
            background: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

<h1>Customer Reviews</h1>

<div id="reviews">
    Loading reviews...
</div>


<script>

const SUPABASE_URL =
    "https://ovefnpllavbyjmfckxhw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_XoYquWqdNy9vzH2LhqAmSg_dTfsBR4l";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadReviews() {

    const container =
        document.getElementById("reviews");

    const { data, error } =
        await supabaseClient
            .from("reviews NCP")
            .select("*")
            .order("created_at", {
                ascending: false
            });


    if (error) {

        container.innerHTML =
            "<p>Unable to load reviews.</p>";

        console.error(error);

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No reviews found.</p>";

        return;
    }


    container.innerHTML =
        data.map(review => {

            const stars =
                "★".repeat(
                    Number(review.rating) || 0
                ) +
                "☆".repeat(
                    5 - (Number(review.rating) || 0)
                );


            return `

                <div class="review">

                    <div class="stars">
                        ${stars}
                    </div>

                    <div class="name">
                        ${review.name}
                    </div>

                    <p>
                        ${review.review}
                    </p>

                    <strong>
                        Status:
                        ${
                            review.approved
                            ? "Approved"
                            : "Pending"
                        }
                    </strong>

                    <div class="buttons">

                        ${
                            !review.approved
                            ? `
                                <button
                                    class="approve"
                                    onclick="approveReview('${review.id}')">

                                    Approve

                                </button>
                            `
                            : ""
                        }

                        <button
                            class="delete"
                            onclick="deleteReview('${review.id}')">

                            Delete

                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


async function approveReview(id) {

    const { error } =
        await supabaseClient
            .from("reviews NCP")
            .update({
                approved: true
            })
            .eq("id", id);


    if (error) {

        console.error(error);

        alert("Unable to approve review.");

        return;
    }


    loadReviews();

}


async function deleteReview(id) {

    if (!confirm(
        "Delete this review?"
    )) return;


    const { error } =
        await supabaseClient
            .from("reviews NCP")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert("Unable to delete review.");

        return;
    }


    loadReviews();

}


loadReviews();

</script>

</body>
</html>
